    :root {

    [data-theme="light"] {
      --bg-app: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-elevated: #E2E8F0;
      --border-subtle: rgba(15, 23, 42, 0.1);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --accent: #059669;
      --accent-dim: rgba(5, 150, 105, 0.12);
      --accent-text: #FFFFFF;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
    }
    .elevated {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
    }
    .btn-accent {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-accent:active { transform: scale(0.97); }
    .text-accent { color: var(--accent); }
    .bg-accent-dim { background: var(--accent-dim); }
    .border-accent { border-color: var(--accent); }
    .input-field {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 0.65rem;
      padding: 0.55rem 0.75rem;
      width: 100%;
      font-size: 0.875rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent); }
    .nav-active {
      color: var(--accent);
      background: var(--accent-dim);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .card { border: 1px solid #ccc !important; break-inside: avoid; }
    }
  </style>
</head>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return Object.assign(defaultState(), JSON.parse(raw));
      } catch (e) {}
      return defaultState();
    }

    let state = loadState();
    let restTimer = { seconds: 90, remaining: 90, running: false, interval: null };
    let gpsTracker = { active: false, watchId: null, points: [], distKm: 0, startTime: null };
    let activeChart = null;

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
    }

    function toast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const border = type === 'error' ? 'border-red-500/50 text-red-200' : 'border-emerald-400/40 text-emerald-100';
      el.className = `card px-3.5 py-2.5 text-xs font-medium shadow-lg pointer-events-auto ${border}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3400);
    }

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function totalsToday() {
      return state.meals.reduce((acc, m) => {
        acc.cal += Number(m.cal) || 0;
        acc.p += Number(m.p) || 0;
        acc.c += Number(m.c) || 0;
        acc.f += Number(m.f) || 0;
        return acc;
      }, { cal: 0, p: 0, c: 0, f: 0 });
    }

    function calcBMR() {
      const u = state.user;
      const base = 10 * u.weightKg + 6.25 * u.heightCm - 5 * u.age;
      return Math.round(u.sex === 'female' ? base - 161 : base + 5);
    }

    function calcTDEE() {
      const mult = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 }[state.user.activityLevel] || 1.55;
      return Math.round(calcBMR() * mult);
    }

    function calcRecoveryScore() {
      const r = state.recovery;
      const sleepScore = Math.min(45, (r.sleepHours / 8) * 35 + r.sleepQuality * 2);
      const waterScore = Math.min(25, (r.waterMl / Math.max(1, state.goals.waterMl)) * 25);
      const sorenessPenalty = (r.soreness - 1) * 5;
      return Math.max(25, Math.min(100, Math.round(30 + sleepScore + waterScore - sorenessPenalty)));
    }

      state.user.xp += pts;

    function renderActivity(main) {
      main.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="card p-4 space-y-3">

            </div>

          </div>

          <div class="card p-4 space-y-2">
            <h2 class="font-bold text-sm">Recent Activity Sessions</h2>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${state.activity.logs.map((a) => `
                <div class="elevated p-3 flex items-center justify-between text-xs">
                  <div>
                    <div class="font-bold flex items-center gap-2">
                      <span>${a.type}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded ${a.verified ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-500/25 text-slate-300'}">${a.source}</span>
                    </div>
                    <div style="color:var(--text-secondary);">${a.date} • ${a.dist} km • ${a.dur} min • ${a.pace}</div>
                  </div>
                  <div class="font-extrabold text-accent">${a.steps.toLocaleString()} steps</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('btn-log-act').addEventListener('click', () => {
        const steps = Number(document.getElementById('act-steps').value) || 0;
        const dist = Number(document.getElementById('act-dist').value) || 0;
        const dur = Number(document.getElementById('act-dur').value) || 1;
        state.activity.todaySteps += steps;
        state.activity.distanceKm = Number((state.activity.distanceKm + dist).toFixed(1));
        state.activity.activeMin += dur;
        state.activity.weeklySteps[6] = state.activity.todaySteps;
        state.activity.logs.unshift({
          id: Date.now(),
          date: new Date().toISOString().slice(0, 10),
          type: document.getElementById('act-type').value,
          steps, dist, dur,
          pace: dist > 0 ? `${(dur / dist).toFixed(1)} min/km` : '-',
          source: 'Manual Entry',
          verified: false
        });
        awardXP(30, 'Logged activity');
        renderActivity(main);
      });

      document.getElementById('btn-gps-toggle').addEventListener('click', () => {
        if (!gpsTracker.active) {
          if (!navigator.geolocation) {
            toast('Geolocation not supported in this browser.', 'error');
            return;
          }
          gpsTracker.active = true;
          gpsTracker.startTime = Date.now();
          gpsTracker.points = [];
          toast('GPS permission requested — tracking active...');
          gpsTracker.watchId = navigator.geolocation.watchPosition(
            (pos) => { gpsTracker.points.push([pos.coords.latitude, pos.coords.longitude]); },
            () => { toast('GPS permission denied or unavailable; use Manual Entry.', 'error'); gpsTracker.active = false; renderActivity(main); },
            { enableHighAccuracy: true }
          );
          renderActivity(main);
        } else {
          if (gpsTracker.watchId !== null) navigator.geolocation.clearWatch(gpsTracker.watchId);
          const mins = Math.max(1, Math.round((Date.now() - gpsTracker.startTime) / 60000));
          gpsTracker.active = false;
          state.activity.logs.unshift({
            id: Date.now(),
            date: new Date().toISOString().slice(0, 10),
            type: 'GPS Run/Walk',
            steps: mins * 110,
            dist: Number((mins * 0.09).toFixed(2)),
            dur: mins,
            pace: '11.1 min/km',
            source: 'Browser GPS',
            verified: true
          });
          awardXP(40, 'Completed GPS session');
          renderActivity(main);
        }
      });
    }

            <div class="grid grid-cols-2 gap-2">
              <div><label class="opacity-70">Full Name</label><input id="pf-name" class="input-field" value="${state.user.name}" /></div>
              <div><label class="opacity-70">Weight (kg)</label><input id="pf-w" type="number" step="0.1" class="input-field" value="${state.user.weightKg}" /></div>
              <div><label class="opacity-70">Calorie Goal</label><input id="pf-cal" type="number" class="input-field" value="${state.goals.calories}" /></div>
              <div><label class="opacity-70">Protein Goal (g)</label><input id="pf-p" type="number" class="input-field" value="${state.goals.protein}" /></div>
              <div><label class="opacity-70">Step Goal</label><input id="pf-steps" type="number" class="input-field" value="${state.goals.steps}" /></div>
              <div><label class="opacity-70">Water Goal (ml)</label><input id="pf-water" type="number" class="input-field" value="${state.goals.waterMl}" /></div>
            </div>
            <button id="btn-save-pf" class="btn-accent w-full py-2.5 rounded-xl">Save Profile &amp; Goals</button>
          </div>

          <div class="card p-4 space-y-3 text-xs">
            <h2 class="font-bold text-sm">Privacy &amp; Account Controls</h2>
            <label class="flex items-center justify-between elevated p-2.5"><span>Public Profile (Private by default)</span><input id="pr-pub" type="checkbox" ${state.user.privacy.publicProfile ? 'checked' : ''} class="accent-emerald-400" /></label>
            <label class="flex items-center justify-between elevated p-2.5"><span>Share Progress Photos</span><input id="pr-pho" type="checkbox" ${state.user.privacy.sharePhotos ? 'checked' : ''} class="accent-emerald-400" /></label>
            <div class="flex gap-2 pt-2">
              <button id="btn-reset-demo" class="elevated flex-1 py-2 rounded-lg font-semibold hover:border-accent">Reset Demo Data</button>
              <button id="btn-del-acc" class="bg-red-500/20 text-red-300 border border-red-500/30 flex-1 py-2 rounded-lg font-semibold">Clear Local Account</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('btn-save-pf').addEventListener('click', () => {
        state.user.name = document.getElementById('pf-name').value || state.user.name;
        state.user.weightKg = Number(document.getElementById('pf-w').value) || state.user.weightKg;
        state.goals.calories = Number(document.getElementById('pf-cal').value) || state.goals.calories;
        state.goals.protein = Number(document.getElementById('pf-p').value) || state.goals.protein;
        state.goals.steps = Number(document.getElementById('pf-steps').value) || state.goals.steps;
        state.goals.waterMl = Number(document.getElementById('pf-water').value) || state.goals.waterMl;
        state.user.privacy.publicProfile = document.getElementById('pr-pub').checked;
        state.user.privacy.sharePhotos = document.getElementById('pr-pho').checked;
        saveState();
        toast('Profile & goals saved');
        renderApp();
      });
      document.getElementById('btn-reset-demo').addEventListener('click', () => {
        state = defaultState();
        saveState();
        toast('Demo data restored');
        renderApp();
      });
      document.getElementById('btn-del-acc').addEventListener('click', () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        state = defaultState();
        toast('Local account data cleared');
        renderApp();
      });
    }

    // ==================== MAIN RENDER & GLOBAL EVENTS ====================
    function renderApp() {
      document.documentElement.setAttribute('data-theme', state.theme);
      document.getElementById('header-username').textContent = state.user.name.split(' ')[0];
      document.getElementById('side-lvl').textContent = state.user.level;
      document.getElementById('side-league').textContent = state.user.league;
      document.getElementById('side-xp').textContent = `${state.user.xp.toLocaleString()} XP`;
      document.getElementById('side-streak').textContent = state.user.streak;

      renderNav();
      const main = document.getElementById('app-main');
      const routes = {
        home: renderHome,
        nutrition: renderNutrition,
        workout: renderWorkout,
        activity: renderActivity,
        coach: renderCoach,
        body: renderBody,
        social: renderSocial,
        recovery: renderRecovery,
        analytics: renderAnalytics,
        integrations: renderIntegrations,
        profile: renderProfile
      };
      (routes[state.tab] || renderHome)(main);
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('btn-theme').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      renderApp();
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      state.lang = state.lang === 'en' ? 'mr' : 'en';
      saveState();
      toast(state.lang === 'mr' ? 'भाषा: मराठी' : 'Language: English');
      renderApp();
    });

    document.getElementById('btn-notif').addEventListener('click', () => {
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-base">Notifications</h3>
          <button id="n-clear" class="text-xs text-accent font-semibold">Mark all read</button>
        </div>
        <div class="space-y-2 text-xs">
          ${state.notifications.map((n) => `
            <div class="elevated p-3 ${n.read ? 'opacity-65' : 'border-accent'}">
              <div class="font-bold">${n.title} <span class="text-[10px] text-accent">• ${n.cat}</span></div>
              <div class="mt-0.5">${n.body}</div>
            </div>
          `).join('')}
        </div>
      `);
      document.getElementById('n-clear').addEventListener('click', () => {
        state.notifications.forEach((n) => (n.read = true));
        document.getElementById('notif-dot').classList.add('hidden');
        saveState();
        closeModal();
      });
    });

    document.getElementById('btn-auth-profile').addEventListener('click', () => {
      state.tab = 'profile';
      saveState();
      renderApp();
    });

    document.getElementById('btn-install-pwa').addEventListener('click', () => {
      openModal(`
        <h3 class="font-bold text-base mb-2">Install FITTRACK PRO on Android</h3>
        <ol class="text-xs space-y-2 list-decimal pl-4" style="color:var(--text-secondary);">
          <li>Host the full-stack app behind HTTPS and open it in <strong>Google Chrome</strong> on Android.</li>
          <li>Tap the <strong>⋮</strong> browser menu in the top-right corner.</li>
          <li>Select <strong>Add to Home screen</strong> / <strong>Install app</strong>.</li>
          <li>Launch from your home screen in standalone mode.</li>
        </ol>
      `);
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    renderApp();
  })();
  </script>
</body>
</html>
